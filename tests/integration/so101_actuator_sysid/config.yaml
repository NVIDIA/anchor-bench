type: actuator_sys_id
joint_parameters:
  - names: [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll, gripper]
    controller:
      type: pd
      delay_duration_ms: 0
      clamps:
        effort_limit: 3.35
        velocity_limit: 30.0
      stiffness: {lower: 1.0, upper: 80.0, initial: 40.0}
      damping: {lower: 0.01, upper: 5.0, initial: 2.0}
    parameters:
      dry_friction: {lower: 0.0, upper: 1.0, initial: 0.25}
      viscous_friction: {lower: 0.0, upper: 2.0, initial: 0.75}
      armature: {lower: 0.0, upper: 0.1, initial: 0.05}
optimizer:
  type: python-cmaes
  sigma: 0.25
  max_iterations: 10
  epsilon: 0.001
simulation:
  type: newton
  usd:
    type: newton-assets
    folder: robotstudio_so101
    path: usd_structured/so101.usda
    ref: a96f0973b6ae69c90609f9fafef9d2c1db2d6431
  physics_freq: 250
  control_freq: 50
  render_freq: 25
  solver:
    type: warp_mujoco
    integrator: implicitfast
    solver_iterations: 5
    line_search_iterations: 2
num_envs: 6
buffer_time: 0.2
seed: 42
output_dir: outputs/integration/so101_actuator_sysid
dataset:
  type: parquet
  source: tests/integration/so101_actuator_sysid/trajectories/train-*.parquet
  joint_name_mapping:
    Rotation: shoulder_pan
    Pitch: shoulder_lift
    Elbow: elbow_flex
    Wrist_Pitch: wrist_flex
    Wrist_Roll: wrist_roll
    Jaw: gripper
  resampling:
    type: uniform
    dt: 0.02
