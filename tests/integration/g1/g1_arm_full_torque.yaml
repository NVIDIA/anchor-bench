type: training
description: Train the enriched four-joint G1 right-arm full-torque GRU.
tags: [g1, right-arm, gru, full-torque, autoregressive]

dataset:
  type: parquet
  source: tests/integration/g1/data/g1_arm_multijoint.parquet
  resampling:
    type: uniform
    dt: 0.002
    time_range: intersection
    interpolation: linear

simulation:
  backend: newton
  usd_path: tests/integration/g1/usd/g1_arm_full_torque.usda
  fixed_base: true

input_features:
  actual_q: null
  position_error: null
  actual_dq: null
  solver_pd: solver_pd
  qfrc_bias: qfrc_bias
  previous_torque: previous_torque

output_features:
  actual_effort: null

mapping:
  right_arm:
    inputs:
      - /g1_29dof_with_hand_rev_1_0/joints/right_shoulder_pitch_joint
      - /g1_29dof_with_hand_rev_1_0/joints/right_shoulder_roll_joint
      - /g1_29dof_with_hand_rev_1_0/joints/right_shoulder_yaw_joint
      - /g1_29dof_with_hand_rev_1_0/joints/right_elbow_joint
    outputs:
      - /g1_29dof_with_hand_rev_1_0/joints/right_shoulder_pitch_joint
      - /g1_29dof_with_hand_rev_1_0/joints/right_shoulder_roll_joint
      - /g1_29dof_with_hand_rev_1_0/joints/right_shoulder_yaw_joint
      - /g1_29dof_with_hand_rev_1_0/joints/right_elbow_joint

model:
  type: gru
  hidden_size: 192
  num_layers: 2
  dropout: 0.225
  output:
    activation: tanh
    scale: 15.0

training:
  epochs: 5
  batch_size: 4
  seed: 48
  validation_ratio: 0.2
  sequence:
    length: 100
  optimizer:
    type: adamw
    learning_rate: 0.0004949926657319083
    weight_decay: 0.0000003376044479094932
  loss:
    type: huber
    delta: 0.3149430512234676
  gradient:
    clip_norm: 1.0
  augmentation:
    input_noise_std: 0.0
  normalization:
    inputs: standard
    outputs: none
  feedback:
    input: previous_torque
    output: actual_effort
    initial_value: 0.0
  checkpoint:
    every_n_epochs: 5

validation:
  validators:
    - name: newton_replay
      type: simulation
      entrypoint: newton_replay
      config:
        signals: [position, velocity]
        substeps: 1
        disable_contacts: true
