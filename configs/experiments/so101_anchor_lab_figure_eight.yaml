schema_version: 1
robot: so101

outputs:
  benchmark: outputs/sim2real_benchmark
  analysis: outputs/sim2real_analysis

seeds: [42]

benchmark:
  num_envs: 1
  headless: true

datasets:
  so101_arm_50motion:
    real_root: inputs/datasets/so101/so101_arm_50motion/train
    motions: [figure-eight]

actuator_models:
  implicit:
    type: implicit
    initial_params: configs/robots/so101/actuators.yaml
    fitted_params: inputs/actuator_params/so101/fitted_seed42.yaml
    benchmark_params: fitted

analysis:
  seeds: [42]
  datasets: [so101_arm_50motion]
  motions: "*"
  actuator_models: "*"
  plots:
    joints: true
    end_effector: true
    require_end_effector: false
