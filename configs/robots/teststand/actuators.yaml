
schema_version: 2
backend: newton
actuators:
  - name: teststand_elbow
    joints: [elbow]
    controller:
      type: fmu
      source: "Migrated CoSimulation FMU component"
      parameters:
        fmu_path: third_party/artifacts/h1/nvidia-motor.fmu
        step_size: 0.0005
        torque_input: pd
        stiffness: 60.0
        damping: 2.0
    delay: {duration_ms: 0.0}
    clamps:
      - type: effort
        parameters: {effort_limit: 300.0}
    physical_parameters: {armature: 0.02, dry_friction: 0.8, viscous_friction: 1.5}
