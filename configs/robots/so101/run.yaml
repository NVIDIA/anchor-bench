simulation:
  physics_freq: 500
  control_freq: 500
  render_freq: 500
  integrator: implicitfast
  solver_iterations: 10
  line_search_iterations: 10
benchmark:
  dataset: so101_arm_50motion
  fix_root: true
  buffer_time: 2.0
  real_init_pose_sync: true
  motion_files: inputs/datasets/so101/so101_arm_50motion/train/figure-eight
  motion_name: figure-eight
  output_folder: outputs/sim2real_benchmark
analysis:
  output_dir: outputs/sim2real_analysis
  sample_dt: 0.005
  motion_names: "*"
sysid:
  output_dir: outputs/sysid/so101/full
  real_data_dir: inputs/datasets/so101/so101_arm_50motion/train/figure-eight
  joints: full
  num_envs: 64
  buffer_time: 2.0
  cmaes:
    sigma: 0.5
    max_iterations: 100
    epsilon: 0.001

training:
  model: gru
  real_data_dir: inputs/datasets/so101/so101_arm_50motion/train
  output_dir: outputs/training/so101
  mappings:
    - input_joints: [Rotation]
      output_joints: [Rotation]
    - input_joints: [Pitch]
      output_joints: [Pitch]
    - input_joints: [Elbow]
      output_joints: [Elbow]
    - input_joints: [Wrist_Pitch]
      output_joints: [Wrist_Pitch]
    - input_joints: [Wrist_Roll]
      output_joints: [Wrist_Roll]
    - input_joints: [Jaw]
      output_joints: [Jaw]
  input_columns: [position, position_error, velocity]
  target_column: torque
  skip_optuna: true
  trials: 20
  trial_epochs: 5
  final_epochs: 50
  n_streams: 4
  noise_std: 0.0
  seed: 42
