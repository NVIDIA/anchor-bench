simulation:
  physics_freq: 500
  control_freq: 500
  render_freq: 500
  integrator: implicitfast
  solver_iterations: 10
  line_search_iterations: 10
benchmark:
  dataset: g1_arm_multi_joint
  fix_root: true
  buffer_time: 2.0
  real_init_pose_sync: true
  motion_files: inputs/datasets/g1/g1_arm_multi_joint/csv
  motion_name: g1_arm_multi_joint
  output_folder: outputs/sim2real_benchmark
analysis:
  output_dir: outputs/sim2real_analysis
  sample_dt: 0.005
  motion_names: "*"
sysid:
  output_dir: outputs/sysid/g1/right_arm
  real_data_dir: inputs/datasets/g1/g1_arm_multi_joint/csv
  joints: [right_shoulder_pitch, right_shoulder_roll, right_shoulder_yaw, right_elbow]
  num_envs: 64
  buffer_time: 2.0
  cmaes:
    sigma: 0.5
    max_iterations: 100
    epsilon: 0.001
training:
  model: hybrid_residual
  real_data_dir: inputs/datasets/g1/g1_arm_multi_joint/csv
  output_dir: outputs/training/g1/right_shoulder_pitch
  input_joints: [right_shoulder_pitch]
  output_joints: [right_shoulder_pitch]
  input_columns: [position, position_error, velocity]
  target_column: torque
  skip_optuna: true
  trials: 20
  trial_epochs: 5
  final_epochs: 5
  n_streams: 4
  noise_std: 0.0
  seed: 42
