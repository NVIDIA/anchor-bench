simulation:
  physics_freq: 500
  control_freq: 500
  render_freq: 500
  integrator: implicitfast
  solver_iterations: 10
  line_search_iterations: 10
benchmark:
  dataset: g1_arm_multi_joint
  fix_root: true
  buffer_time: 2.0
  real_init_pose_sync: true
  motion_files: inputs/datasets/g1/g1_arm_multi_joint/csv
  motion_name: g1_arm_multi_joint
  output_folder: outputs/sim2real_benchmark
analysis:
  output_dir: outputs/sim2real_analysis
  sample_dt: 0.005
  motion_names: "*"
sysid:
  output_dir: outputs/sysid/g1/right_arm
  real_data_dir: inputs/datasets/g1/g1_arm_multi_joint/csv
  joints: [right_shoulder_pitch, right_shoulder_roll, right_shoulder_yaw, right_elbow]
  num_envs: 64
  buffer_time: 2.0
  cmaes:
    sigma: 0.5
    max_iterations: 100
    epsilon: 0.001
training:
  model: gru
  real_data_dir: inputs/datasets/g1/g1_arm_multijoint/train
  output_dir: outputs/training/g1/right_arm_fulltorque_fixed192
  input_joints:
    [right_shoulder_pitch, right_shoulder_roll, right_shoulder_yaw, right_elbow]
  output_joints:
    [right_shoulder_pitch, right_shoulder_roll, right_shoulder_yaw, right_elbow]
  input_columns:
    [position, position_error, velocity, solver_pd, dynamic_bias, previous_torque]
  target_column: torque
  skip_optuna: true
  trials: 20
  trial_epochs: 5
  final_epochs: 50
  n_streams: 4
  noise_std: 0.0
  seed: 48
  hidden_size: 192
  num_layers: 2
  dropout: 0.225
  learning_rate: 0.0004949926657319083
  weight_decay: 0.0000003376044479094932
  huber_delta: 0.3149430512234676
  chunk_length: 100
  output_activation: tanh
  output_scale: 15.0
  target_normalization: identity
  pd_kp: 40.0
  pd_kd: 1.0
