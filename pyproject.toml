
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anchor-bench"
version = "0.1.0"
description = "Focused Newton SysID and sim-to-real benchmark tooling for robot actuator models."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
full = [
  "isaacsim==6.0.0.0",
  "newton[sim] @ git+https://github.com/vidurv-nvidia/newton.git@b6402cf6630df90234cdf3a2c72f9b08ac72472e",
  "mujoco~=3.10.0",
  "warp-lang==1.15.0.dev20260626",
  "mujoco-warp~=3.10.0,>=3.10.0.1",
  "cmaes",
  "optuna",
  "scipy",
  "pandas",
  "pyarrow",
  "tqdm",
  "matplotlib",
]

[project.scripts]
anchor-bench = "anchor_bench.cli.main:main"

[tool.setuptools.packages.find]
include = ["anchor_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[tool.uv.sources]
warp-lang = { index = "nvidia" }
