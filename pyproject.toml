
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anchor-bench"
version = "0.1.0"
description = "Focused Newton SysID and sim-to-real benchmark tooling for robot actuator models."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0",
  "numpy>=1.26",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
  "matplotlib",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pyright>=1.1.390",
  "ruff>=0.5",
]
full = [
  "isaacsim==6.0.0.0",
  "newton[sim] @ git+https://github.com/newton-physics/newton.git@c1c508ce9304aca6ac67e39a1744c8740c1d9d2a",
  "mujoco>=3.5.0",
  "mujoco-warp>=3.5.0",
  "cmaes",
  "optuna",
  "scipy",
  "pandas",
  "pyarrow",
  "huggingface_hub>=0.34",
  "matplotlib",
]

[project.scripts]
anchor-bench = "anchor_bench.cli.main:main"

[tool.setuptools.packages.find]
include = ["anchor_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["anchor_bench"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C90"]

[tool.ruff.lint.per-file-ignores]
"anchor_bench/benchmark/runtime.py" = ["C901"]
"anchor_bench/sysid/runtime.py" = ["C901"]
[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.pyright]
include = [
  "anchor_bench/core",
  "anchor_bench/experiments",
  "anchor_bench/robots",
  "anchor_bench/*/runner.py",
]
pythonVersion = "3.12"
typeCheckingMode = "basic"
