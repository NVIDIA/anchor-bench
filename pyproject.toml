[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anchor-bench"
version = "0.1.0"
description = "Configuration-driven task runner for Anchor Bench."
requires-python = ">=3.10"
dependencies = [
  "cmaes",
  "newton==1.4.0",
  "numpy>=1.23,<3",
  "optuna>=4.9,<5",
  "pandas>=2.1,<3",
  "pyarrow>=14,<26",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "torch>=2.3,<3",
  "usd-core>=25.5,<26.5; python_full_version < '3.14'",
  "usd-core>=26.8,<27; python_full_version >= '3.14'",
]

[project.optional-dependencies]
simulation = [
  "newton[importers,sim]==1.4.0",
]
mlflow = [
  "mlflow>=3.0,<4",
]
wandb = [
  "wandb>=0.26,<1",
]
dev = [
  "pyright>=1.1,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
anchor-bench = "anchor_bench.cli:main"

[project.entry-points."anchor_bench.mlops_backends"]
wandb = "anchor_bench.mlops.backends.wandb:WandbBackend"

[tool.setuptools.packages.find]
include = ["anchor_bench*"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
  "integration: downloads external data and exercises an end-to-end workflow",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Keep annotations evaluable on the project's minimum supported Python.
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.pyright]
exclude = ["build", ".venv", "**/__pycache__"]
pythonVersion = "3.10"
