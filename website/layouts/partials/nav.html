<header class="site-header">
  <div class="container site-header__inner">
    <a class="site-logo" href="{{ .Site.Home.RelPermalink }}">
      <span class="site-logo__mark" aria-hidden="true"></span>
      {{ .Site.Title }}
    </a>
    <div class="site-header__right">
      <nav class="site-nav" aria-label="Main">
        <a href="{{ .Site.Home.RelPermalink }}"{{ if .IsHome }} aria-current="page"{{ end }}>Home</a>
        <a href="{{ (.Site.GetPage "/blog").RelPermalink }}"{{ if eq .Section "blog" }} aria-current="page"{{ end }}>Blog</a>
        <a href="{{ (.Site.GetPage "/documentation").RelPermalink }}"{{ if eq .Section "documentation" }} aria-current="page"{{ end }}>Documentation</a>
      </nav>
      <div class="theme-switch" role="group" aria-label="Color theme">
        <button type="button" class="theme-switch__btn" data-theme-btn="light" aria-pressed="true">
          <span class="theme-switch__dot theme-switch__dot--light" aria-hidden="true"></span>Light
        </button>
        <button type="button" class="theme-switch__btn" data-theme-btn="dark" aria-pressed="false">
          <span class="theme-switch__dot theme-switch__dot--dark" aria-hidden="true"></span>Dark
        </button>
        <button type="button" class="theme-switch__btn" data-theme-btn="novel" aria-pressed="false">
          <span class="theme-switch__dot theme-switch__dot--novel" aria-hidden="true"></span>Novel
        </button>
      </div>
    </div>
  </div>
</header>
