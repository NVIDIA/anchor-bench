name: Docker build

on:
  push:
    branches:
      - main
      # NVIDIA self-hosted runners require trusted PR branches copied by
      # copy-pr-bot; pull_request events are not allowed on those runners.
      # https://docs.gha-runners.nvidia.com/platform/onboarding/pull-request-testing/
      - "pull-request/[0-9]+"
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILDKIT: 1

jobs:
  kitless:
    name: Build kitless image and run unit tests
    # Self-hosted runners must not run on pull_request; only trusted pushes.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/pull-request/')
    runs-on: linux-amd64-cpu4
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build anchor-bench:kitless
        run: ./setup.sh --kitless

      - name: Verify kitless image
        run: docker image inspect anchor-bench:kitless

      - name: Run unit tests
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/anchor-bench-home \
            -e XDG_CACHE_HOME=/tmp/anchor-bench-cache \
            -e MPLCONFIGDIR=/tmp/anchor-bench-cache/matplotlib \
            -v "${{ github.workspace }}:/workspace/anchor-bench" \
            -w /workspace/anchor-bench \
            -e ANCHOR_BENCH_ASSET_DIR=/workspace/anchor-bench/assets/robots \
            anchor-bench:kitless \
            python3 -m pytest

  full:
    name: Build full image and run all tests
    # Self-hosted GPU runners must not run on pull_request; only trusted pushes.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/pull-request/')
    runs-on: linux-amd64-gpu-rtxpro6000-latest-1
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build anchor-bench:full
        run: ./setup.sh --full

      - name: Verify full image
        run: docker image inspect anchor-bench:full

      - name: Run all tests (including runtime end-to-end)
        run: |
          docker run --rm \
            --gpus all \
            -e NVIDIA_DRIVER_CAPABILITIES=all \
            -e NVIDIA_VISIBLE_DEVICES=all \
            -e ACCEPT_EULA=Y \
            -e OMNI_KIT_ACCEPT_EULA=YES \
            -e ANCHOR_BENCH_RUN_RUNTIME_E2E=1 \
            -e ANCHOR_BENCH_ASSET_DIR=/workspace/anchor-bench/assets/robots \
            -v "${{ github.workspace }}:/workspace/anchor-bench" \
            -w /workspace/anchor-bench \
            anchor-bench:full \
            python3 -m pytest -v
