name: github-pages

on:
  push:
    branches: [main, ggallagher/github-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install Hugo
        run: go install github.com/gohugoio/hugo@v0.147.9

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: |
          cd website
          hugo --minify --gc

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
