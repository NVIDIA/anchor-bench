name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  host-safe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check anchor_bench tests
      - run: python -m pyright
      - run: python -m pytest --cov=anchor_bench --cov-report=term-missing
